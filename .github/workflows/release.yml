name: Test and release addon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify addon ZIP
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/package_addon.py --tag "$RELEASE_TAG"
          else
            python scripts/package_addon.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WoWContextBridge-addon
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WoWContextBridge-addon
          path: release
      - name: Publish addon release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/*.zip \
            --verify-tag --title "WoW Context Bridge $RELEASE_TAG" \
            --notes "Experimental WoW Retail addon. Extract the ZIP into _retail_/Interface/AddOns/ and enable WoW Context Bridge. Remove CompanionPoC if installed. See the repository README for compatibility, privacy and testing instructions." \
            "${flags[@]}"
